    <meta charset="UTF-8" />

    <title>Mast</title>
    <script>
      // Apply the persisted theme before first paint so neither the splash
      // nor the app flashes the wrong background (mirrors lib/prefs.ts).
      try {
        var theme = localStorage.getItem("mast.theme");
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
    <style>
      html {
        background: #ffffff;
      }
      html.dark {
        background: #0a0a0a;
      }
      /* Splash shown until Vue mounts and replaces #app's children. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        /* Never flush to the frame, however narrow the window gets. */
        padding: 0 24px;
        box-sizing: border-box;
      }
      /* The lockup sets the type size; the mark is sized in `em` from it, so
         both halves scale together at the breakpoints below. */
      #splash .lockup {
        display: flex;
        /* Row 0 against row 0: both halves are the same six-row grid, and the
           mark's last row is shorter than a full one, so centring floats it. */
        align-items: flex-start;
        gap: 0.9em;
        font-family:
          "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        /* Scales with the window instead of stepping at breakpoints: a tiling
           manager hands out widths that no set of breakpoints anticipates, and
           the lockup is 25 characters wide, so a fixed size either overflows a
           narrow window or floats in a wide one. */
        font-size: clamp(7px, 2.2vw, 15px);
        color: #334155;
      }
      /* The mark is vectors, not glyphs. Drawn from block characters it only
         holds its shape while the font's cell is exactly half as wide as it
         is tall — the letters survive that being off, the mark visibly does
         not. Same art as the app icons (src-tauri/icons/icon-source.svg). */
      #splash .lockup svg {
        /* 6 rows × 1.05 line-height × (365 ÷ 390 units of ink) */
        height: 5.9em;
        width: auto;
        fill: currentColor;
        flex: none;
      }
      /* Both halves are vectors now. The wordmark was block glyphs at a
         monospace family, which sheared whenever the font's cell was not
         exactly half as wide as it was tall — the same fault the menubar's
         copy had, fixed there and left here. */
      html.dark #splash .lockup {
        color: #cbd5e1;
      }
      #splash p {
        margin: 0;
        /* One line wherever one line fits. Only the window's width limits it,
           so it wraps in a narrow tile and nowhere else — and when it does
           wrap, `balance` splits it evenly and `text-align` keeps both halves
           centred, rather than an orphan hard against the left edge. A
           character cap here forced two lines into windows with room for one. */
        max-width: 82vw;
        text-align: center;
        text-wrap: balance;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        font-size: clamp(11px, 1.7vw, 13px);
        /* Sentence case, tracked lightly. The wide tracking and the uppercase
           went together: caps need the air, mixed case reads as gappy with it. */
        letter-spacing: 0.02em;
        color: #737373;
      }
      html.dark #splash p {
        color: #a3a3a3;
      }
    </style>
