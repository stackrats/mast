    <meta charset="UTF-8" />

    <title>Mast</title>
    <script>
      // Apply the persisted theme before first paint so neither the splash
      // nor the app flashes the wrong background (mirrors lib/prefs.ts).
      try {
        var theme = localStorage.getItem("mast.theme");
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
    <style>
      html {
        background: #ffffff;
      }
      html.dark {
        background: #0a0a0a;
      }
      /* Splash shown until Vue mounts and replaces #app's children. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      /* The lockup sets the type size; the mark is sized in `em` from it, so
         both halves scale together at the breakpoints below. */
      #splash .lockup {
        display: flex;
        /* Row 0 against row 0: both halves are the same six-row grid, and the
           mark's last row is shorter than a full one, so centring floats it. */
        align-items: flex-start;
        gap: 0.9em;
        font-family:
          "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        font-size: 13px;
        color: #334155;
      }
      /* The mark is vectors, not glyphs. Drawn from block characters it only
         holds its shape while the font's cell is exactly half as wide as it
         is tall — the letters survive that being off, the mark visibly does
         not. Same art as the app icons (src-tauri/icons/icon-source.svg). */
      #splash .lockup svg {
        /* 6 rows × 1.05 line-height × (365 ÷ 390 units of ink) */
        height: 5.9em;
        width: auto;
        fill: currentColor;
        flex: none;
      }
      /* The wordmark stays block glyphs, on a monospace family with tight,
         uniform line boxes or the rows shear. */
      #splash pre {
        margin: 0;
        font: inherit;
        line-height: 1.05;
        letter-spacing: 0;
        white-space: pre;
      }
      html.dark #splash .lockup {
        color: #cbd5e1;
      }
      #splash p {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #737373;
      }
      html.dark #splash p {
        color: #a3a3a3;
      }
      /* 54 columns wide, so it needs ~430px at 13px. Shrink rather than let
         the rows wrap, which would destroy the shape. */
      @media (max-width: 560px) {
        #splash pre {
          font-size: 9px;
        }
      }
      @media (max-width: 380px) {
        #splash pre {
          font-size: 7px;
        }
      }
    </style>
