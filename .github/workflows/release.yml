name: Release binaries

# The whole release, from one tag push: builds the desktop bundles and the
# mast/mast-daemon binaries for Linux, macOS (Apple Silicon + Intel) and
# Windows, and attaches them to the release for that tag — created as a
# DRAFT if it does not exist yet, so the notes get written by a human
# before anything goes public. Also dispatchable against an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v0.3.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing ships from a red tree. A tag push does not itself run ci.yml, so
  # this looks up the CI run for the very commit being released and demands
  # that it concluded `success` — waiting out a run still in flight, because
  # tagging straight after a merge races the main-branch run. Deliberately
  # strict and with no bypass input: a re-cut of an existing release has to
  # be green too. Gate both entry jobs, so a red tree does not even get as
  # far as creating the draft.
  verify:
    name: CI must be green
    runs-on: ubuntu-latest
    # The workflow-level `permissions:` block zeroes every scope it does not
    # name, so reading another workflow's runs has to be asked for here.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Release commit: $SHA"
          deadline=$(( SECONDS + 1800 ))
          while :; do
            latest=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last // empty')
            if [ -z "$latest" ]; then
              status=""; conclusion=""
              echo "No CI run recorded for $SHA yet."
            else
              status=$(printf '%s' "$latest" | jq -r '.status')
              conclusion=$(printf '%s' "$latest" | jq -r '.conclusion // "pending"')
              echo "CI run $(printf '%s' "$latest" | jq -r '.html_url') — status=$status conclusion=$conclusion"
            fi
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green for $SHA — the release may proceed."
                exit 0
              fi
              echo "::error::CI concluded '$conclusion' for $SHA. Release blocked until CI is green."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 30m waiting for CI on $SHA (last status: ${status:-none}). Release blocked."
              exit 1
            fi
            sleep 30
          done

  # The web assets are platform-independent — build them once, with the
  # same Vite Plus toolchain CI already proves, and hand the dist to the
  # per-OS bundle jobs so Windows never needs the vp installer.
  frontend:
    name: Frontend dist
    needs: [verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/desktop-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The workspace's own pinned vp, through pnpm — same reasoning as
      # ci.yml: no dependence on the curl installer's idea of latest.
      - name: Install dependencies (pnpm, frozen lockfile)
        run: |
          npm install -g pnpm@11.1.2
          pnpm install --frozen-lockfile
      - name: vp build
        run: pnpm exec vp build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: clients/desktop-vue/dist
          if-no-files-found: error

  # The upload target must exist before the build jobs race to attach
  # assets. A tag push gets a draft; a dispatch against an already
  # published release leaves it exactly as it is.
  ensure-release:
    name: Ensure release exists
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --draft --title "Mast $TAG" \
            --notes "Draft — binaries attached by CI; notes to come."

  desktop:
    name: ${{ matrix.suffix }}
    needs: [frontend, ensure-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            suffix: linux-x86_64
          # Built on a native arm64 runner rather than cross-compiled: the
          # desktop bundle links webkit2gtk and friends, and those have to be
          # the arm64 builds of the libraries, which only an arm64 host has.
          # GitHub's hosted arm runners are free for public repositories.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            suffix: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf pkg-config xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: clients/desktop-vue/dist
      - name: Build mast + mast-daemon
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p mast-cli -p mast-daemon
      - name: Build desktop bundle
        shell: bash
        working-directory: clients/desktop-vue
        run: |
          # dist is prebuilt; null out beforeBuildCommand so tauri does not
          # reach for vp on this runner.
          printf '{"build":{"beforeBuildCommand":null}}' > ci-config.json
          npx --yes @tauri-apps/cli@^2 build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --config ci-config.json
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BIN="target/${{ matrix.target }}/release"
          STAGE="$(mktemp -d)"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            cp "$BIN/mast.exe" "$BIN/mast-daemon.exe" "$STAGE/"
            ARCHIVE="mast-$VERSION-${{ matrix.suffix }}.zip"
            (cd "$STAGE" && 7z a -bd "$OLDPWD/$ARCHIVE" mast.exe mast-daemon.exe)
          else
            cp "$BIN/mast" "$BIN/mast-daemon" "$STAGE/"
            ARCHIVE="mast-$VERSION-${{ matrix.suffix }}.tar.gz"
            tar -czf "$ARCHIVE" -C "$STAGE" mast mast-daemon
          fi
          UPLOADS=("$ARCHIVE")
          shopt -s nullglob
          for bundle in "$BIN"/bundle/dmg/*.dmg "$BIN"/bundle/nsis/*-setup.exe \
            "$BIN"/bundle/deb/*.deb "$BIN"/bundle/rpm/*.rpm \
            "$BIN"/bundle/appimage/*.AppImage; do
            UPLOADS+=("$bundle")
          done
          gh release upload "$TAG" "${UPLOADS[@]}" --clobber
